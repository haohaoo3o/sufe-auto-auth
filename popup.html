<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>上财自动认证 · 设置</title>
<style>
  @font-face {
    font-family: "SufePixel";
    src: url("fonts/press-start-2p.ttf") format("truetype");
    font-display: swap;
  }
  @font-face {
    font-family: "SufeHei";
    src: url("fonts/source-han-sans-sc-bold-subset.woff2") format("woff2");
    font-weight: 700;
    font-display: swap;
  }
  :root { color-scheme: dark; }
  html { background: transparent; }
  body {
    width: 340px;
    margin: 0;
    padding: 16px;
    overflow-x: hidden;
    color: #79b8ff;
    background: linear-gradient(145deg, rgba(52, 46, 33, 0.84), rgba(41, 36, 26, 0.74) 58%, rgba(30, 26, 18, 0.84));
    border: 1px solid rgba(216, 192, 138, 0.2);
    border-radius: 14px;
    backdrop-filter: blur(22px) saturate(125%);
    -webkit-backdrop-filter: blur(22px) saturate(125%);
    font: 700 12px/1.7 "SufePixel", "SufeHei", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: none;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(121, 184, 255, 0.03) 0 1px, transparent 1px 4px);
  }
  .matrix-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .matrix-bg canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .matrix-bg::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(0deg, rgba(121, 184, 255, 0.08) 0 1px, transparent 1px 3px);
    mix-blend-mode: screen;
    animation: crt-flicker 180ms steps(2, end) infinite;
  }
  .matrix-bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, transparent 46%, rgba(121, 184, 255, 0.1) 50%, transparent 54%),
      radial-gradient(ellipse at center, transparent 46%, rgba(0, 0, 0, 0.5) 100%);
    background-size: 100% 260%, 100% 100%;
    animation: scan 3.2s linear infinite, crt-flicker 260ms steps(2, end) infinite;
  }
  body > :not(.matrix-bg) { position: relative; z-index: 1; }
  h3 {
    margin: 0 0 14px;
    color: #d0e6ff;
    font-size: 14px;
    font-weight: 400;
    text-shadow: 0 0 14px rgba(77, 141, 255, 0.4);
  }
  h3::before { content: ">_ "; color: #4d8dff; }
  label { display: block; margin: 10px 0 4px; color: rgba(190, 219, 255, 0.92); font-size: 10px; text-shadow: 0 0 8px rgba(121, 184, 255, 0.4); }
  input[type="text"], input[type="password"] {
    width: 100%;
    box-sizing: border-box;
    padding: 7px 9px;
    color: #d0e6ff;
    caret-color: #79b8ff;
    background: rgba(24, 20, 14, 0.66);
    border: 1px solid rgba(121, 184, 255, 0.28);
    border-radius: 7px;
    outline: none;
    font: 700 12px/1.5 "SufePixel", "SufeHei", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  }
  input:focus { border-color: #79b8ff; box-shadow: 0 0 16px rgba(77, 141, 255, 0.18); }
  .pwd-wrap { position: relative; }
  .pwd-wrap input { padding-right: 54px; }
  .pwd-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: auto;
    padding: 2px 6px;
    color: #4d8dff;
    background: transparent;
    border: none;
    font-size: 10px;
    cursor: pointer;
  }
  .pwd-toggle:hover { color: #d0e6ff; background: transparent; }
  .row { display: flex; align-items: flex-start; gap: 7px; margin: 13px 0 4px; color: rgba(190, 219, 255, 0.92); font-size: 10px; text-shadow: 0 0 8px rgba(121, 184, 255, 0.4); }
  .row input { margin-top: 4px; accent-color: #4d8dff; }
  .row label { margin: 0; line-height: 1.6; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
  button {
    padding: 7px 4px;
    color: #9ccbff;
    text-shadow: 0 0 10px rgba(121, 184, 255, 0.35);
    background: linear-gradient(135deg, rgba(77, 141, 255, 0.16), rgba(77, 141, 255, 0.05));
    border: 1px solid rgba(121, 184, 255, 0.32);
    border-radius: 7px;
    font: 700 11px/1.5 "SufePixel", "SufeHei", "Source Han Sans SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    cursor: pointer;
  }
  button:hover { border-color: rgba(121, 184, 255, 0.78); box-shadow: 0 0 14px rgba(77, 141, 255, 0.2); }
  button.primary {
    color: #051226;
    border-color: rgba(208, 230, 255, 0.85);
    background: linear-gradient(135deg, #d0e6ff, #4d8dff);
    box-shadow: 0 0 18px rgba(77, 141, 255, 0.24);
  }
  #status { margin-top: 12px; color: #a9d1ff; font-size: 10px; white-space: pre-wrap; word-break: break-word; text-shadow: 0 0 9px rgba(121, 184, 255, 0.45); }
  #status.err { color: #ffd0d0; text-shadow: 0 0 10px rgba(255, 208, 208, 0.4); }
  #stats { margin-top: 7px; color: rgba(180, 212, 255, 0.8); font-size: 9px; text-shadow: 0 0 8px rgba(121, 184, 255, 0.35); }
  .tip { margin-top: 13px; color: rgba(186, 217, 255, 0.85); font-size: 9px; line-height: 1.65; text-shadow: 0 0 8px rgba(121, 184, 255, 0.35); }
  @keyframes crt-flicker { 0%, 100% { opacity: 0.86; } 50% { opacity: 0.72; } }
  @keyframes scan { from { background-position: 0 -160%, 0 0; } to { background-position: 0 100%, 0 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>
<div class="matrix-bg" aria-hidden="true"></div>
<h3>上财自动认证</h3>

<label for="username">学号</label>
<input type="text" id="username" autocomplete="off" spellcheck="false">

<label for="password">密码（仅保存在本机浏览器，不上传）</label>
<div class="pwd-wrap">
  <input type="password" id="password" autocomplete="off">
  <button type="button" id="togglePwd" class="pwd-toggle" title="显示密码">显示</button>
</div>

<div class="row">
  <input type="checkbox" id="enabled">
  <label for="enabled">自动登录：检测到上财登录页时自动完成验证并登录</label>
</div>

<div class="btns">
  <button id="save" class="primary">保存</button>
  <button id="login">登录</button>
  <button id="testvcode">测试验证码</button>
  <button id="test">测试滑块</button>
</div>

<div id="status"></div>
<div id="stats"></div>

<div class="tip">
  3 秒倒计时内后台预拉图 + 预识别验证码，倒计时结束即登录；<br>
  识别未通过会自动换图立即重试（最多 10 次），仍失败才请你人工输入；<br>
  「登录」直接在当前上财登录页执行（页面未注入脚本时会自动注入，无需刷新）；<br>
  「测试验证码」「测试滑块」只验证识别/定位能力，不提交账号。
</div>

<script src="sufe-fx.js"></script>
<script src="popup.js"></script>
</body>
</html>
